services:
  - type: web
    name: trading-app-backend
    # 追 `stable`，不是 `main`。
    #
    # Render 自己的 auto-deploy 是**在 push 的當下**觸發的，所以直接追 main 會送
    # 出測試還沒跑完的 commit。這個專案的規則是「CI 綠才算綠」，而那條規則不可以
    # 因為對象換成使用者就放寬——他沒有 CI，也沒有辦法判斷剛送到他機器上的是什麼。
    #
    # `stable` 只在 .github/workflows/ci.yml 的 deploy job **最後一步**前進，而
    # 那時候已經確認過三件事：所有測試綠燈、部署真的送達、送達的那一版在線上是
    # 健康的。換句話說——
    #
    #     使用者拿到的每一版，都是我們自己的實例已經跑起來而且活著的那一版。
    #
    # 我們自己的服務**追 main**，用 Deploy Hook 觸發。那不是不一致，那是分工：
    # 我們是先當白老鼠的那一個，而 stable 是白老鼠活下來之後才前進的那條線。
    #
    # ⚠️ 如果我們自己的服務是由這份 blueprint 管理的，改這個檔案可能會把我們也
    #    切到 stable。那會讓 CI 的「等它變成這個 commit」那一步逾時而紅——loud，
    #    不是 silent，而且那一步的錯誤訊息會提到這個可能。修法是在 Render 後台把
    #    我們那個服務的分支改回 main。
    #
    # ＊ autoDeploy: true 跟 Render 自己的建議相反，而那是刻意的。
    #
    # 他們的文件對 Deploy to Render 按鈕寫著：
    #
    #     For a service that is meant to be deployed via a Deploy to Render
    #     button, it is strongly advised to set `autoDeploy: false` … This
    #     ensures that code pushes to the repo … don't trigger an automatic
    #     deploy of every instance deployed via the Deploy to Render button.
    #
    # 他們擔心的事情，正是這個專案要的事情：按鈕部署出去的每一份，都會因為我們推
    # 的東西而重新部署。#52 的整個理由就是「使用者拿不到我們的更新（含安全修補）」。
    #
    # 而他們警告的那個風險，是用上面那個 `branch: stable` 換掉的——一次 push 不會送
    # 到任何人手上，只有 stable 前進才會。**不要照著他們的文件把這裡改成 false**：
    # 改下去不會有任何東西變紅，而每一個現有使用者從此拿不到任何更新。
    #
    # （Deploy to Render 不會 fork，Render 直接從原始的 repo 部署。所以那些服務追的
    # 是這個 repo 的 stable，這個開關關掉就是全部一起停。）
    autoDeploy: true
    branch: stable
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # repo 根目錄，不是 ./backend：Dockerfile 現在也要建前端，所以它要同時
    # 看得到 frontend/ 和 backend/。這個服務因此同時供應 API 和畫面——**只要
    # 部署一次**。
    dockerContext: .
    plan: free
    # **不要在這裡加 `?deep=1`。**
    #
    # 這一格問的是「要不要重開這台機器」。Render 的文件（2026-09）：健康檢查失敗 15
    # 秒就先把流量拔掉，失敗 60 秒「Render automatically restarts the instance」；部
    # 署當中 15 分鐘等不到全部通過就「Render cancels the deploy」。
    #
    # 而 `/healthz` 裡有好幾格是**重開機修不好、也不會自己好**的：一顆下架的代號、
    # 通知被關掉、上游整個掛掉、24 小時內有一則放棄的提醒。深的那一條把那些也算進
    # 去，所以指過去的話，其中任何一個成立就會讓這台機器每十幾分鐘被重開一次、永
    # 遠——策略池被丟掉、暖身重來、那幾秒服務是斷的。**為了保護提醒而做的探測，會把
    # 提醒弄停。** 而且他從此收不到任何更新，因為新版永遠等不到一次通過的檢查。
    #
    # 沒帶參數的這一條只在「重開有機會修好」的時候回 503，而那**只剩一格**：盯盤那
    # 條 while 迴圈不再往前（行程還活著、還在回應 HTTP，但卡在一個永遠不會回答的
    # socket 上）。除了重開沒有別的辦法，所以那正好就是這一格該問的事。
    #
    # 資料庫連不上刻意**不算**：撐得過 60 秒門檻的那幾種原因（連線字串打錯、專案被刪
    # 掉、免費方案的每月運算時數用完）重開一萬次都回不來，而最後那個在這條路上每個月
    # 固定發生一次。
    #
    # 深的那一條是給看門狗和 UptimeRobot 的，見 DEPLOYMENT.md 第 4 節。
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string after creating the DB
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        # 平台自己產生，使用者一格都不用填。
        #
        # 以前這裡是 sync: false，因為 Fernet 只吃一種形狀（base64 的 32 bytes）而
        # generateValue 給的是普通隨機字串。於是流程變成：部署 → 打開網址 → 設定頁按
        # 產生 → 複製 → 回後台找到環境變數那頁 → 貼上 → 存檔 → 等重新部署。七個動
        # 作、跨兩個網站，而任何一步中斷就前功盡棄。真的拿去給目標使用者測試，回來的
        # 是「我不會用」。
        #
        # 那是格式需求不是安全需求，所以由 config.fernet_key 在這一邊解決：任何夠長
        # 的隨機值都收，已經是 Fernet 金鑰的原封不動（舊的部署不能被弄壞）。金鑰仍然
        # 只活在環境變數裡——資料庫整份被倒出去也拿不到它。
        generateValue: true
      # 推播金鑰（VAPID）刻意**不在這裡問**。
      #
      # 它是一對 P-256 金鑰，平台生不出那種形狀，所以以前這三格只能是空白——而「兩個
      # 都留空是合法設定」實際上的意思是：照最短路徑走完的人永遠收不到手機通知，而且
      # 沒有任何東西會說。這個產品的一句話就是「想在手機上收到股票提醒」。
      #
      # 現在由 config.vapid_keys 從 SECRET_ENCRYPTION_KEY 推導（不同的鹽），所以它自己
      # 就會有。想用自己那一對的人，在平台後台加上 VAPID_PUBLIC_KEY／VAPID_PRIVATE_KEY
      # 就會蓋過推導——已經設好的部署因此完全不受影響。
      - key: TV_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # **留空。** 這個服務同時供應 API 和畫面，所以瀏覽器發出的請求是同源的，
        # 根本不會觸發 CORS——沒有東西要放行。
        #
        # 原本這裡寫著「你的 Vercel 前端網址，等前端部署好之後再填」。那句話在只
        # 部署一次之後會**叫他去填一個他根本沒有的網址**，而填錯的後果是瀏覽器把
        # 每一個回應都丟掉：畫面全空，而 F12 之外看不出任何線索。
        #
        # 只有把畫面另外放在 Vercel／Netlify／Cloudflare 的人才要填，值是那一份的
        # 網址。
        sync: false
      - key: LOG_LEVEL
        value: "INFO"
      - key: PUBLIC_BASE_URL
        # LEAVE IT BLANK on Render. The app falls back to RENDER_EXTERNAL_URL,
        # which Render injects with this service's own https://...onrender.com
        # address -- so nobody has to copy a URL back into the service it came
        # from, which is a step a first-time deployer skips and then wonders
        # why TradingView webhooks never arrive.
        #
        # Fill it in ONLY for a custom domain, which is the one case Render's
        # variable does not know about.
        sync: false
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: WORKER_ENABLED
        value: "true"
      - key: NOTIFICATIONS_ENABLED
        value: "true"
      - key: MARKET_DATA_POLL_INTERVAL_SEC
        value: "5"
      - key: PENDING_ORDER_EXPIRY_MINUTES
        value: "180"
      - key: WS_TICKET_TTL_SECONDS
        value: "30"

      # --- AI 輔助（選填，不填就是沒有這個功能，其他一切照常）-------------
      #
      # Declared here so the deploy form actually ASKS. Without these keys in
      # the blueprint the feature exists in the code and is unreachable: Render
      # only prompts for what is declared, so somebody would have to already
      # know to go and add the variables by hand -- which is exactly the 「you
      # have to already know」 gap the setup page was built to close.
      #
      # Optional on purpose. The key is the deployer's own and every question
      # costs them money on it, so nothing in the app requires it: with these
      # blank the assistant simply does not appear.
      - key: AI_PROVIDER
        value: "openai_compatible"
      - key: AI_BASE_URL
        # OpenRouter by default -- one key reaches many models. Any
        # OpenAI-compatible endpoint works; use https://api.anthropic.com with
        # AI_PROVIDER=anthropic instead.
        value: "https://openrouter.ai/api/v1"
      - key: AI_API_KEY
        # Your own key from the provider above. Blank = no AI features.
        sync: false
      - key: AI_MODEL
        # The model id as that provider spells it, e.g.
        # anthropic/claude-sonnet-4.5 on OpenRouter. Blank = no AI features.
        sync: false
