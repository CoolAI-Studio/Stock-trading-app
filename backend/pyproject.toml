[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "FURB"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; long constraint/enum definition lines are
# expected and hand-wrapping them on every `revision --autogenerate` is
# counterproductive. Other checks (F821 etc.) still apply -- that's what
# caught the missing `app.db.types` import below.
"alembic/versions/*.py" = ["E501", "W291"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)`/etc. in argument defaults is the
# documented, idiomatic pattern -- not the mutable-default-argument footgun
# B008 exists to catch. Tell ruff these callables are safe there.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
]
