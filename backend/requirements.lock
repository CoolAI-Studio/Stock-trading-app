# Exact versions, generated from a working install with `pip freeze`.
#
# requirements.txt says what this app depends on; this file says what it was
# last known to work with, transitive packages included. Both CI and the
# deploy image install from HERE, so what ships is what the tests ran against
# -- installing floating ranges in one place and a lock in the other would
# mean CI never tested the build that actually deploys.
#
# Before this existed, pressing Manual Deploy pulled whatever the upstreams
# had published that day, months after the version anyone had tested. One
# breaking release anywhere in this list stops the container starting, and
# with `alembic upgrade head && uvicorn` as the command that is the whole
# service -- with no CI signal, because CI had installed something else.
#
# To update: edit requirements.txt, reinstall, `pip freeze > requirements.lock`,
# and let CI say whether it still works.
