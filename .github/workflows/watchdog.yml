# Is the alerting still running?
#
# The one failure this product cannot survive is the worker stopping, because
# every alert stops with it -- silently. /healthz has been able to see that
# since it was written (it runs a real query, reads the worker heartbeat, and
# answers 503 when either is wrong), but nothing ever asked it. The only way to
# find out was to open the page, which is what somebody who set an alert is
# specifically not doing.
#
# A dying process cannot report its own death, so this runs somewhere else.
# When it fails, GitHub emails the repo owner -- that email is the entire
# point of this file.
#
# 這個 repo 是公開的，所以排程用掉的 Actions 分鐘是免費的（GitHub：「The use of
# standard GitHub-hosted runners is free: In public repositories.」）。
#
# **但使用者那一份不一定是公開的**，而這件事會咬到「更新」。
#
# Vercel 的 clone 會在他自己的帳號下開一個新的 repo（不是 fork，所以排程一開始就會
# 跑），而那多半是私人的——這是他自己的股票提醒系統。私人 repo 在 GitHub Free 上一個
# 月只有 **2,000 分鐘**，而且「usage is blocked once you use up your quota」。
#
# 這個排程是每 15 分鐘一次 = 一個月 2,880 次，每一次都要 checkout 加 setup-python，
# 所以就算 HEALTH_URL 沒設、腳本第一行就 exit 0，那一分鐘照樣算。2,880 > 2,000。
#
# 額度用完之後 GitHub 擋掉的是**所有**的 Actions，包括 sync-from-upstream.yml——那條
# 每天從上游快轉的線，正是他拿到更新（含安全修補）的唯一管道。也就是說：一個為了
# 「看得到提醒有沒有在跑」而存在的排程，每個月大約第二十天會把「拿得到更新」關掉。
# 兩件事都是安靜的。
#
# 所以底下那個 `if: vars.HEALTH_URL != ''`。**被跳過的 job 不計分鐘**，而沒設
# HEALTH_URL 的人本來就沒有在用這個看門狗。他有更好的東西：安裝頁教他設一個每 5 分鐘
# 檢查一次、壞掉就寄信的外部監控（#93）——比這個快得多（這個排程實際上好幾個小時才跑
# 一次，見下面的 cron），而且不吃他的額度。
#
# ONE HOLE, WRITTEN DOWN RATHER THAN HOPED OVER: GitHub disables scheduled
# workflows in a public repository after 60 days with no activity in it. If
# this project goes quiet for two months, this watchdog switches itself off --
# silently, which is the exact failure it exists to catch. Re-enabling it is
# one click on the Actions tab, but nothing tells you to go and click it. If
# the alerts ever need to survive a quiet stretch, this has to move to a
# service that has no such rule (UptimeRobot's free tier does 5-minute checks
# and emails on failure; /healthz was written for it).

name: Watchdog

on:
  schedule:
    # Every 30 minutes ON PAPER -- and "on paper" is the operative phrase.
    #
    # 量到的（這個 repo 的 Actions 紀錄，#112）：2026-09-05 起 46 次，間隔最短 1.9 小
    # 時、中位數 3.6、最長 6.0。8/27 以前設定是 `*/15`（一天該 96 次），實際 19～39
    # 次；8/27 起掉到一天 2～8 次，而那幾天沒有人動過這個檔案。**排得越密不會跑得越
    # 多**——GitHub 的排程器是盡力而為，實際上把它壓在一天六到八次上下。
    #
    # 所以這是「好一陣子都沒人發現」的最後一道網，**不是即時警報**：壞掉之後可能要好
    # 幾個小時才收到信。即時的是 DEPLOYMENT.md 第 4 節那個每 5 分鐘的外部監控。
    #
    # 為什麼不改得更密：量到的是改密沒有用；而私人副本的 Actions 額度要照設定值的最壞
    # 情況算（見檔頭），那一邊改密是真的會多花。
    #
    # 至於資料庫：這個 job 打的是 `?deep=1`，而 #100 之後深的那一條平常一句 SQL 都不送
    # ——它讀盯盤迴圈剛跑完一輪的證據。只有證據過期（迴圈已經出事）的時候才自己
    # `SELECT 1`，所以這個間隔不再是資料庫預算。它仍然不比收盤後的輪詢密
    # （test_the_watchdog_does_not_eat_his_update_budget 釘著），好讓一次沒人處理的故
    # 障期間，每一次檢查不會順便把 Neon 釘在醒著的狀態。
    - cron: "*/30 * * * *"
  # So the owner can prove it works without waiting for the schedule -- an
  # untested alarm is not an alarm.
  workflow_dispatch:

# A pile-up of runs all reporting the same outage is noise; the newest answer
# is the only one worth having.
concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  health:
    # 沒設就不要起。理由在檔頭：起來只為了印一行「沒設定，略過」的 job 照樣算一分
    # 鐘，而那會在私人副本上每個月把他的更新管道一起關掉。
    if: vars.HEALTH_URL != ''
    runs-on: ubuntu-latest
    # A hung request must not hold a runner open; the script's own timeout is
    # 60s and it makes at most two attempts 45s apart.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # No pip install: the script is deliberately stdlib-only so this job
      # cannot be broken by a dependency, which would take the watchdog down
      # exactly when a release is in flight.
      - name: Ask the deployment whether it is still alerting
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::HEALTH_URL 這個 repository variable 沒有設定，略過檢查。"
            echo "要啟用：Settings → Secrets and variables → Actions → Variables，"
            echo "新增 HEALTH_URL，值是你後端的 https://<你的服務>.onrender.com/healthz"
            exit 0
          fi
          python backend/scripts/watchdog.py "$HEALTH_URL"
