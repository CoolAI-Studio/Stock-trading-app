# 把這一份副本從上游的 `stable` 更新上來。
#
# ＊ 為什麼需要它。
#
# 後端是直接從我們的 repo 部署的，所以它追 `stable` 就會自己更新（#52）。前端不
# 是：Vercel 的部署按鈕走的是 `new/clone`，會在使用者的 GitHub 帳號下**複製一份
# repo**，然後從那一份部署。複製品跟上游沒有任何關係——我們修掉的安全洞，它一個都
# 拿不到。
#
# 這個工作流程住在那份複製品裡（它是 repo 的一部分，所以會被一起複製過去），每天把
# 上游 `stable` 的內容快轉過來。Vercel 看到 push 就會重新部署。
#
# ＊ 為什麼是 `stable` 而不是 `main`。
#
# `main` 上的東西可能還沒跑完測試。而 `stable` 只在 ci.yml 的 deploy job 最後一步
# 前進，那時候已經確認過：所有測試綠燈、部署真的送達、送達的那一版在線上是健康的。
# 換句話說，那一版我們自己已經跑過了。
#
# ＊ 只快轉，絕不覆蓋。
#
# 使用者可能改過那份程式碼——那是他的權利，這是他自己的副本。快轉失敗的時候這裡
# 就停下來並說清楚，不會用 --force 把他的東西蓋掉。
#
# ＊ 動到 workflow 檔的更新，自動同步推不上去（#114）。
#
# GitHub 不讓 `GITHUB_TOKEN` 新增或修改 `.github/workflows/` 底下的檔案，而且沒有任何
# `permissions:` 給得了它。所以那種更新這裡不推——推了一定被拒——改成在他的 repo 開一
# 則 issue 說明怎麼辦。他自己選擇在 repo 的 secret 放一把有 workflow 權限的 token
# （`SYNC_TOKEN`）的話，checkout 就用那一把，照常推。不放的人不受影響。
#
# ＊ 就算它從來沒有跑起來，也不會安靜地失敗。
#
# 他的 repo 上 Actions 可能是關的、可能有衝突、可能他根本沒看這一頁。所以前端會把
# 自己的版本印在系統狀態頁上跟上游比（src/lib/buildInfo.ts）——**沒更新到這件事在
# app 裡看得見**，而不是只在一個他不會打開的 Actions 分頁裡。

name: 從上游更新這一份副本

on:
  schedule:
    # 每天一次。安全修補值得早一點拿到，但更頻繁只是在製造沒有內容的部署。
    - cron: "17 4 * * *"
  # 不想等一天的時候，在 Actions 分頁按一下就好。
  workflow_dispatch:

permissions:
  contents: write
  # 分岔的時候要開一個 PR，而不是就此不再更新。見底下那一步。
  pull-requests: write
  # 推不上去的更新（動到 workflow 檔）要留一則說得出怎麼辦的 issue（#114）。
  issues: write

jobs:
  sync:
    name: 快轉到上游的 stable
    runs-on: ubuntu-latest
    # **絕對不要在上游自己身上跑。**
    #
    # 在原始的 repo 上，這會把 main 快轉到 stable——而 stable 永遠落後於 main（它
    # 只在部署成功後前進）。那不是快轉，會失敗；但就算失敗，一個每天在自己身上跑
    # 的同步工作流程也只是噪音。
    if: github.repository != 'CoolAI-Studio/Stock-trading-app'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 他自己放了 SYNC_TOKEN 就用那一把：只有它推得動 workflow 檔的更新。沒放就是
          # 平常那一把，行為跟以前一樣。
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: 拿上游的 stable
        run: |
          git remote add upstream https://github.com/CoolAI-Studio/Stock-trading-app.git
          git fetch upstream stable

      - name: 快轉，不覆蓋
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 固定的分支名字，所以每天只會有同一個 PR 被更新，不會冒出一堆。
          SYNC_BRANCH: upstream-sync
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          current="$(git rev-parse HEAD)"
          upstream="$(git rev-parse upstream/stable)"

          if [ "$current" = "$upstream" ]; then
            echo "::notice::已經是最新的（${upstream:0:7}），沒有要做的事。"
            exit 0
          fi

          # 動到 workflow 檔的更新（#114）。要推上去的 commit 裡只要有一個動到
          # .github/workflows/，GITHUB_TOKEN 的 push 一定被拒——快轉那一條和分岔時開 PR
          # 要先推的那個分支都一樣。原本的結果是一句英文加一個紅叉，前端從此停在舊版，
          # 而他完全不知道發生什麼事。看得出一定失敗的，就不推，留一則說得出怎麼辦的
          # issue。已經有一則就只更新內容：每天一則新的，就是每天一封信。
          if [ "${HAS_SYNC_TOKEN:-false}" != "true" ] && [ -n "$(git rev-list "$current..$upstream" -- .github/workflows)" ]; then
            echo "::warning::上游這一版改到了自動化設定檔（.github/workflows/），GitHub 不讓自動同步替你改它們。沒有推，改成開一則 issue 說明怎麼更新。"
            title="自動更新停在這裡：上游這一版改到了自動化設定檔"
            body="$(printf '%s\n' \
              '這一份副本每天會從上游自動更新。這一次沒有更新：上游這一版改到了自動化設定檔（`.github/workflows/` 底下的檔案），而 GitHub 不讓自動同步替你改那個資料夾。這是 GitHub 刻意的安全設計，不是你的設定出錯。' \
              '' \
              '**在你處理之前，之後的每一次更新都會停在這裡。** app 的系統狀態頁也會顯示前端落後上游。' \
              '' \
              '- 你的版本：`'"${current:0:7}"'`' \
              '- 上游最新：`'"${upstream:0:7}"'`' \
              '' \
              '兩種做法，選一種就好：' \
              '' \
              '1. **重新部署一份（最簡單）**：照 DEPLOYMENT.md 的〈想把畫面分開放〉（https://github.com/CoolAI-Studio/Stock-trading-app/blob/stable/DEPLOYMENT.md）從頭部署一次，記得把 `VITE_API_BASE_URL` 設回你的後端網址。新的那一份就是最新版；你在這一份上自己改過的東西不會帶過去。' \
              '2. **讓自動更新繼續**：建立一把有 workflow 權限的 GitHub token，放進這個 repo 的 Settings → Secrets and variables → Actions，名稱是 `SYNC_TOKEN`。之後的自動同步會用它，這種更新也推得上去。' \
              '' \
              '處理好之後，這則 issue 可以直接關掉。')"
            existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[].number' | head -n 1)"
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --body "$body"
              echo "::notice::開了一則 issue，說明怎麼更新。"
            else
              gh issue edit "$existing" --body "$body"
              echo "::notice::已經有一則說明了，把內容更新到 ${upstream:0:7}。"
            fi
            exit 0
          fi

          # 快轉的定義：我現在的 HEAD 是上游那一版的祖先。不是的話，代表這份副本
          # 上有上游沒有的東西——他改過程式碼。怎麼合要由他決定，不是我們決定。
          #
          # **但「由他決定」不等於「從此不再更新」。** 原本這裡是 exit 1，於是那份副
          # 本再也拿不到任何東西（包括安全修補），而唯一的痕跡是一個他不會打開的分頁
          # 上的紅叉。那不是別的軟體的樣子：你裝了什麼外掛，系統更新照樣會來敲門，只
          # 是你可以不裝。
          #
          # 所以改成開一個 PR：更新變成「一個等你按的東西」。而且那個 PR 的來源就是
          # 上游 `stable` 現在指的那一個 commit——**不管中間過了幾版，合下去就是最新
          # 版**，不用一版一版追。
          if ! git merge-base --is-ancestor "$current" "$upstream"; then
            echo "::warning::這一份副本上有上游沒有的修改，所以不能直接快轉。開一個 PR 讓你自己決定。"
            echo "  你的版本：${current:0:7}"
            echo "  上游 stable：${upstream:0:7}"

            # 釘死一個分支名字。每天開一個新的 PR 就是每天一個噪音，而噪音會讓他把
            # Actions 關掉——那樣連這個 PR 都不會再有。
            git push --force origin "$upstream:refs/heads/$SYNC_BRANCH"

            if [ -z "$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[].number')" ]; then
              gh pr create \
                --head "$SYNC_BRANCH" \
                --base "$GITHUB_REF_NAME" \
                --title "更新到上游最新版（${upstream:0:7}）" \
                --body "$(printf '%s\n' \
                  '這份副本上有上游沒有的修改，所以每天的自動同步不能直接快轉——改成開這個 PR。' \
                  '' \
                  '**要不要更新是你的事。** 但合下去就是最新版：這個 PR 的來源是上游 `stable` 現在' \
                  '指的那一個 commit，不管中間過了幾版，一次就到位。' \
                  '' \
                  '- 你的版本：`'"${current:0:7}"'`' \
                  '- 上游最新：`'"${upstream:0:7}"'`' \
                  '' \
                  '如果 GitHub 說有衝突，那是你改過的檔案跟上游改到同一個地方。合掉衝突之後' \
                  '再按合併就好；你自己加的東西不會不見。' \
                  '' \
                  '合併之後前端會自動重新部署。')"
              echo "::notice::開了一個 PR。要不要合是你的事，合了就是最新版。"
            else
              echo "::notice::已經有一個等著的 PR 了，把它更新到 ${upstream:0:7}。"
            fi
            exit 0
          fi

          git push origin "$upstream:$GITHUB_REF_NAME"
          echo "::notice::更新到 ${upstream:0:7}。前端會自動重新部署。"
