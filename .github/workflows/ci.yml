name: CI

# Every push and every PR. The project's rule is "green before the next step"
# (CLAUDE.md), and until this existed nothing enforced it -- 744 backend and
# 153 frontend tests had never once run anywhere but a laptop.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point finishing a run for a commit
# that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        # The lock, not the floating ranges: installing one here and the other
        # in the deploy image would mean CI never tested the build that ships.
        run: pip install -r requirements.lock

      - name: The lock still matches what is declared
        # Runs before the tests, because if these disagree the tests are
        # measuring the wrong thing. Changing a range in requirements.txt
        # without regenerating the lock produces a green build that tested
        # nothing -- which is how a Dependabot PR relaxing a deliberate pin
        # sailed through on its first day.
        run: python scripts/check_lock.py

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests alembic

      - name: Migrations apply from empty, and match the models
        # Catches the failure the test suite structurally cannot: the suite
        # builds its schema with create_all, so a model change with a missing
        # or wrong migration passes every test and then breaks the deploy,
        # which runs `alembic upgrade head` on boot.
        env:
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: |
          alembic upgrade head
          alembic check

      - name: SAST
        # A GATE, unlike pip-audit below, and the difference is who can fix it.
        # A CVE in a transitive package waits on somebody else's release; a
        # finding here is in code in this repo, and clearing one costs a
        # `# nosec BXXX` with a sentence saying why -- which is the review this
        # is for. Silencing without the sentence is the thing to catch in a
        # diff, and a diff is where it now shows up.
        #
        # app and scripts, not tests: the suite is full of `assert` (B101) and
        # fake credentials by design, and drowning the real findings in those
        # is how a scanner stops being read.
        run: |
          pip install bandit
          bandit -r app scripts

      - name: Known vulnerabilities in the locked dependencies
        # Advisory, not a gate: a CVE published in a transitive package is
        # worth knowing about today, but failing the build would block an
        # unrelated fix on an upstream release nobody here controls. The
        # annotation is the point.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --desc

      - name: Tests
        run: pytest -q

      - name: 資料外流稽查
        # A GATE, and a different kind of check from everything above it. The
        # isolation tests are hand-written lists, and a list cannot miss what
        # was never put on it: add a router with no dependency tomorrow and
        # every one of them stays green, because none of them knows it exists.
        #
        # This reads the operations off the running app and the tables off the
        # model registry, plants a canary in every secret and every row the
        # owner has, and then sweeps the whole surface anonymously and as a
        # second account. A new public endpoint fails this build until somebody
        # writes down why it is public.
        run: python scripts/audit.py

  frontend:
    name: frontend (tsc + oxlint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        # Two workers, not the default one-per-core: the runner has 4 GB and
        # jsdom is heavy, and a pool that loses a worker reports it as an
        # "error" rather than a failure, which is indistinguishable from a
        # real break in the log.
        run: npx vitest run --maxWorkers=2

      - name: Build
        run: npm run build

  # THE ONE GATE THAT OPENS A REAL BROWSER.
  #
  # It exists because of a specific escape. `e8124ce` fixed 「圖表往前拉是一片空
  # 白」; ten unit tests were green, all four jobs here were green, the deploy
  # verified itself against the live commit -- and the chart still would not
  # move under the user's mouse. `fixLeftEdge: true` plus `fitContent()` makes
  # the library refuse to scroll, and NOTHING above can see that:
  #
  #   - the unit tests replace the drawing library with a hand-written stub
  #     whose `fitContent` is an empty function, so the stub cannot reproduce it
  #   - the real-library test runs in jsdom, where layout waits for an animation
  #     frame that never comes, so interaction is untestable there
  #   - tsc, oxlint and vite build have no opinion about what an option DOES
  #
  # DELIBERATELY NOT IN deploy's `needs`. A browser test is the flakiest thing
  # in this file -- a browser download, a slow runner, a rendering change -- and
  # deploy blocks on its dependencies. 「警告不能停擺」 outranks the chart: a
  # flaky drag must never be able to hold back a fix to the notification path.
  # It still turns this run red, which is the part that matters.
  chart:
    name: chart (real browser, real drag)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keyed on the lockfile: Playwright pins a browser build, so a new
      # Playwright means a new download and an old cache must not be reused.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Drag the chart
        run: npm run test:chart

  # THE WALK A NEW PERSON ACTUALLY TAKES, in a real browser, on a deployment
  # that has nothing in it.
  #
  # `first-deploy` below boots the real container with blank config, and
  # `deploy_smoke.py` checks the endpoints answer -- but NOBODY HAD LOOKED AT
  # THE SCREENS. The first time anyone did, four things were wrong at once:
  # the login page printed unrendered markdown in its first sentence, a
  # database failure pasted a Python traceback with site-packages paths into
  # the page, 「步驟 2」 appeared three times in a row, and the database blank
  # -- the one choice a cloud deployer can only make on that page, because the
  # app is locked until it is answered -- was a paragraph with four options
  # buried in it.
  #
  # None of those turn any other job red. The unit tests each see one component
  # with the rest stubbed; jsdom has no real navigation and no layout; and
  # `first-deploy` reads status codes.
  #
  # Same reasoning as the chart job for the shape of it: assert only what the
  # reader can see -- text on screen, buttons that exist, links that go
  # somewhere -- never classes or coordinates, which drift and turn a gate into
  # noise. And DELIBERATELY NOT IN deploy's `needs`: 「警告不能停擺」 outranks
  # the onboarding pages, so a flaky browser must not hold back a fix to the
  # notification path.
  first-run:
    name: first run (real browser, blank deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        # The walk boots the REAL backend twice: once with nothing filled in,
        # once with the values the setup page told them to paste.
        run: pip install -r requirements.lock
        working-directory: backend

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Walk it
        run: npm run test:firstrun
        working-directory: frontend

  # Everything above tests the CODE. This tests the thing a new person actually
  # does: press Deploy, leave the optional boxes blank, open the URL.
  #
  # Nobody had ever walked that path -- all the confidence in it came from
  # reading render.yaml, which is not evidence. The first run of this job found
  # three places a new user stops, two of them the app's own fault.
  #
  # It runs the REAL image, because the one failure that matters most cannot be
  # reproduced any other way: the CMD is `alembic upgrade head && uvicorn`, so a
  # database that is unreachable means uvicorn never starts and no port is ever
  # bound -- and the setup page that exists to explain a missing DATABASE_URL is
  # then unreachable for exactly the reason it exists.
  first-deploy:
    name: first deploy (blank config, real container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image that actually ships
        run: docker build -t trading-app-backend:ci ./backend

      - name: Start it the way a brand-new deploy starts it
        # Every optional value blank, exactly what the README tells somebody to
        # submit. No JWT_SECRET, no encryption key, no push keys.
        run: |
          docker run -d --name first-deploy -p 8000:8000 \
            -e PORT=8000 \
            -e DATABASE_URL=sqlite:////tmp/first-deploy.db \
            -e JWT_SECRET= \
            -e SECRET_ENCRYPTION_KEY= \
            -e TV_WEBHOOK_SECRET= \
            -e VAPID_PUBLIC_KEY= \
            -e VAPID_PRIVATE_KEY= \
            trading-app-backend:ci

      - name: Wait for it to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::容器 30 秒內沒有回應任何請求。新使用者拿到的會是一個死掉的網址。"
          docker logs first-deploy
          exit 1

      - name: Can a new user get past the first screen?
        run: python backend/scripts/deploy_smoke.py http://localhost:8000

      - name: And when the one value they had to copy is wrong
        # DATABASE_URL is the only field on that form the app cannot generate --
        # it is copied out of somebody else's console -- so it is the single
        # most likely one to be wrong. The old CMD was
        # `alembic upgrade head && uvicorn`, which meant a wrong value killed
        # the process before any port was bound: a dead URL, and the setup page
        # that exists to explain exactly this went down with it.
        run: |
          docker run -d --name bad-database -p 8001:8000             -e PORT=8000             -e DATABASE_URL=postgresql://user:password-CI-CANARY@127.0.0.1:1/nope             -e JWT_SECRET=ci-not-a-placeholder-0123456789             -e TV_WEBHOOK_SECRET=ci-not-a-placeholder-9876543210             -e SECRET_ENCRYPTION_KEY=             trading-app-backend:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8001/api/setup/status >/dev/null 2>&1; then
              echo "setup page answered after ${i}s"
              break
            fi
            sleep 1
          done
          body=$(curl -sS http://localhost:8001/api/setup/status)
          echo "$body"
          if [ -z "$body" ]; then
            echo "::error::DATABASE_URL 打錯之後，容器沒有起來——使用者拿到的是一個死掉的網址。"
            docker logs bad-database
            exit 1
          fi
          # 健康檢查也要過，否則第一次部署會被平台判定失敗，而那個要解釋問題的
          # 頁面會跟著一起消失。
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://localhost:8001/healthz)
          echo "healthz -> $code $(cat /tmp/health.json)"
          [ "$code" = "200" ] || { echo "::error::/healthz 回 $code，第一次部署會被判定失敗。"; exit 1; }
          # 而且那一頁不准把密碼印出來：驅動的錯誤訊息會帶著整串連線字串。
          # 這個假密碼刻意寫成 user:password 開頭——`scripts/audit.py` 的倉庫掃描
          # 會認出它是文件／測試用的佔位值而不報，同時 -CI-CANARY 那一段仍然夠
          # 獨特，grep 得到。（第一版用了一個像真的密碼，稽查員當場就把 CI 擋下來
          # 了，那是它應該做的事。）
          if printf '%s' "$body" | grep -q password-CI-CANARY; then
            echo "::error::設定頁把連線字串裡的密碼印出來了。"
            exit 1
          fi

      - name: Container log (on failure)
        if: failure()
        run: |
          docker logs first-deploy || true
          docker logs bad-database || true

  # Nobody presses Deploy. That was the whole problem: CLAUDE.md carried
  # 「Render 自動部署 webhook 沒觸發，目前手動」 as a status line for weeks, and
  # a manual step in the release path is a step that gets skipped -- the
  # deployed backend spent this entire session older than the code, twice.
  #
  # NOT by fixing Render's own auto-deploy, deliberately. That fires on PUSH,
  # so it would ship a commit whose tests have not run yet, and this project's
  # rule is that CI green is the only green. This job needs all three jobs
  # above, so a deploy can only ever happen to a commit that passed everything
  # -- including the blank-config container check.
  #
  # ONE-TIME SETUP, and it is the only part a person has to do:
  #   Render dashboard -> your service -> Settings -> Deploy Hook -> copy URL
  #   GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
  #     name:  RENDER_DEPLOY_HOOK_URL
  #     value: the URL you copied
  # Without the secret this job skips with a notice instead of failing, so a
  # fork or a clone is never broken by a secret it does not have.
  deploy:
    name: deploy (only after everything is green)
    needs: [backend, frontend, first-deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Longer than a build takes, shorter than a stuck one runs. A free-tier
    # image build plus a cold start is a few minutes; twenty-five means the
    # wait below can time out and SAY SO, rather than be killed mid-poll with
    # no message.
    timeout-minutes: 25
    steps:
      - name: What is running right now, before anything is asked for
        id: before
        # The baseline for 「did it change?」. Read BEFORE the hook is called:
        # afterwards there is no way to tell a new build from the old one
        # still answering.
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "commit=" >> "$GITHUB_OUTPUT"
            echo "started_at=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body=$(curl -sS --max-time 60 "$HEALTH_URL" || true)
          echo "$body"
          echo "commit=$(printf '%s' "$body" | jq -r '.version.commit // ""')" >> "$GITHUB_OUTPUT"
          echo "started_at=$(printf '%s' "$body" | jq -r '.version.started_at // ""')" >> "$GITHUB_OUTPUT"

      - name: Ask Render to deploy this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL 這個 secret 沒有設定，略過自動部署。"
            echo "設定一次就好：Render → 你的服務 → Settings → Deploy Hook → 複製網址，"
            echo "然後 GitHub → Settings → Secrets and variables → Actions → New repository secret，"
            echo "名稱 RENDER_DEPLOY_HOOK_URL，值貼上那個網址。之後每次 CI 綠燈都會自動部署。"
            exit 0
          fi
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$HOOK")
          echo "Render 回應 HTTP $code"
          cat /tmp/deploy.json || true
          case "$code" in
            2*) echo "::notice::已要求 Render 部署 ${GITHUB_SHA:0:7}。" ;;
            *)  echo "::error::Render 拒絕了部署請求（HTTP $code）。線上跑的還是舊版。"; exit 1 ;;
          esac

      # A 201 from the hook means the request was ACCEPTED, nothing more. The
      # build can still fail, the image can still refuse to start -- and the
      # old build goes on answering every probe perfectly while that happens,
      # because an old build is not a sick one. That is precisely how 「the
      # backend is older than main」 went unnoticed twice in one session, and
      # a release step that cannot tell the difference has not finished the
      # job it was added to do.
      #
      # NO EXTRA SETUP: this reuses the HEALTH_URL variable the watchdog
      # already needs. Without it the step says what it could not verify and
      # passes -- a fork is never broken by a variable it does not have.
      - name: Wait until the deployment says it is this commit
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          BEFORE_COMMIT: ${{ steps.before.outputs.commit }}
          BEFORE_STARTED: ${{ steps.before.outputs.started_at }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::HEALTH_URL 沒有設定，只能確認 Render 收下了請求，無法確認部署真的送達。"
            echo "要啟用：Settings → Secrets and variables → Actions → Variables，"
            echo "新增 HEALTH_URL，值是你後端的 .../healthz"
            exit 0
          fi
          want="${GITHUB_SHA:0:7}"
          echo "等的是 $want；現在線上是 '${BEFORE_COMMIT:-未知}'（啟動於 '${BEFORE_STARTED:-未知}'）"
          landed=""
          body=""
          for i in $(seq 1 45); do
            sleep 20
            body=$(curl -sS --max-time 60 "$HEALTH_URL" || true)
            commit=$(printf '%s' "$body" | jq -r '.version.commit // ""' 2>/dev/null || true)
            started=$(printf '%s' "$body" | jq -r '.version.started_at // ""' 2>/dev/null || true)
            if [ "$commit" = "$want" ]; then
              echo "::notice::線上已經是 $want（等了 $((i * 20)) 秒）。"
              landed="commit"
              break
            fi
            # The host may not tell the container which commit it built. That
            # is a courtesy, not a guarantee, and this project does not bind
            # itself to one host -- so a process start later than the one
            # measured before the hook counts as proof that A deploy landed.
            # It just cannot prove WHICH, and says so.
            if [ -z "$commit" ] && [ -n "$started" ] && [ "$started" != "$BEFORE_STARTED" ]; then
              echo "::notice::線上重新啟動了（'${BEFORE_STARTED:-未知}' → $started）。這個平台沒有提供 commit，所以只能確認「有部署」，不能確認「是這一個 commit」。設定 APP_GIT_COMMIT 就能確認。"
              landed="restart"
              break
            fi
            echo "  等了 $((i * 20)) 秒：線上仍是 '${commit:-未知}'（啟動於 '${started:-未知}'）"
          done
          if [ -z "$landed" ]; then
            echo "::error::等了 15 分鐘，線上跑的還不是 $want。部署沒有送達，線上是舊版。"
            echo "去部署平台看這次 build 的紀錄。常見原因：build 失敗，或容器一啟動就死（例如 DATABASE_URL 打錯）。"
            echo "最後一次拿到的回應："
            echo "$body"
            exit 1
          fi

      - name: And that what landed is actually alive
        # 「新版上線了」不等於「新版活著」。The alerting IS the product, so a
        # release is not finished until the thing that sends the alerts
        # answers. A cold start plus the worker's first tick takes a moment,
        # hence a grace window rather than a single shot.
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then exit 0; fi
          body=""
          for i in $(seq 1 10); do
            body=$(curl -sS --max-time 60 "$HEALTH_URL" || true)
            state=$(printf '%s' "$body" | jq -r '.status // ""' 2>/dev/null || true)
            case "$state" in
              ok)    echo "::notice::新版上線，而且健康。"; exit 0 ;;
              setup) echo "::notice::新版上線，目前在設定模式（設定還沒填完）。"; exit 0 ;;
            esac
            echo "  第 $i 次：status='${state:-沒有回應}'，再等 30 秒"
            sleep 30
          done
          echo "::error::新版上線了，但五分鐘內 /healthz 沒有恢復正常。警告可能是停擺的。"
          echo "$body"
          exit 1
